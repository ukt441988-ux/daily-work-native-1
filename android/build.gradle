// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ["-Xlint:none", "-nowarn"]
        options.encoding = "UTF-8"
    }
}

subprojects {
    project.ext.set('compileSdkVersion', rootProject.ext.compileSdkVersion)
    project.ext.set('targetSdkVersion', rootProject.ext.targetSdkVersion)
    project.ext.set('minSdkVersion', rootProject.ext.minSdkVersion)

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                lintOptions {
                    abortOnError false
                    checkReleaseBuilds false
                    warningsAsErrors false
                }
            }
        }
    }
}

gradle.taskGraph.whenReady {
    tasks.matching { it.name.toLowerCase().contains("lint") || it.name.toLowerCase().contains("test") }.configureEach {
        enabled = false
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

