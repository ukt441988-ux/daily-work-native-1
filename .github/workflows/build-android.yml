name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "Configuring Android SDK from $ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
          fi
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: |
          npm install --include=dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || npx @capacitor/cli copy android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Restoring gradle wrapper..."
            gradle wrapper --gradle-version 8.14.3 || true
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyWork-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build Android App Bundle (AAB for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || gradle bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace || gradle bundleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DailyWork-PlayStore-Bundle-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14
