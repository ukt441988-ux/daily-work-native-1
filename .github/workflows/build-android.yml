name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "Configuring Android SDK from $ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" || true
          fi
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: |
          npm install --include=dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || npx @capacitor/cli copy android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Android Debug APK
        working-directory: android
        run: |
          echo "Configuring Gradle 8.13 wrapper..."
          gradle wrapper --gradle-version 8.13 --distribution-type bin || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyWork-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build Android App Bundle (AAB for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || gradle bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace || gradle bundleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DailyWork-PlayStore-Bundle-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release with APK and Play Store AAB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Lucky App Android APK & Play Store Bundle (Build #${{ github.run_number }})"
          body: |
            ### 📱 Lucky App - Android APK & Google Play Console Bundle

            ✅ **1. நேரடி APK டவுன்லோட் (மொபைலில் உடனே இன்ஸ்டால் செய்ய):**
            - கீழே உள்ள Assets பகுதியில் **`app-debug.apk`**-ஐ கிளிக் செய்து டவுன்லோட் செய்து மொபைலில் நேரடியாக இன்ஸ்டால் செய்து பயன்படுத்தலாம்.

            🚀 **2. Google Play Store Console (.aab Bundle):**
            - Play Store Console அப்லோட் செய்வதற்கு **`DailyWork-PlayStore-Bundle-AAB`** Artifacts-ல் தயாராக உள்ளது!
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
