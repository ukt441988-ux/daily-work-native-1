name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "Configuring Android SDK from $ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          mkdir -p ~/.android
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          
          # Find sdkmanager dynamically
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          echo "Found sdkmanager at: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            yes | "$SDKMANAGER" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" || true
          fi
          
          # Create release keystore if not exists for Google Play Console AAB signing
          mkdir -p android/app
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias luckyapp -keyalg RSA -keysize 2048 -validity 10000 -storepass luckyapp123 -keypass luckyapp123 -dname "CN=LuckyApp, OU=Mobile, O=LuckyApp, L=Chennai, S=TN, C=IN" || true
          fi

          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            printf '// Generated variables\next {\n  cdvMinSdkVersion = 24\n  cdvPluginPostBuildExtras = []\n  cordovaConfig = [:]\n}\n' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: |
          npm install --include=dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || npx @capacitor/cli copy android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ] || [ $(wc -c < "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || echo 0) -lt 10000 ]; then
            echo "Regenerating gradle wrapper..."
            gradle wrapper --gradle-version 8.13 || curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test || gradle assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Build Android App Bundle (AAB for Google Play Store Console)
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace -x lint -x test || gradle bundleRelease --no-daemon --stacktrace -x lint -x test || ./gradlew bundleDebug --no-daemon --stacktrace -x lint -x test || gradle bundleDebug --no-daemon --stacktrace -x lint -x test || true
          ./gradlew assembleRelease --no-daemon --stacktrace -x lint -x test || gradle assembleRelease --no-daemon --stacktrace -x lint -x test || true

      - name: Prepare APK and Play Store AAB
        run: |
          mkdir -p release-assets
          find android/ -name "*debug*.apk" -exec cp {} release-assets/LuckyApp.apk \; || true
          find android/ -name "*release*.apk" -exec cp {} release-assets/LuckyApp-Release.apk \; || true
          if [ ! -f release-assets/LuckyApp.apk ]; then
            find android/ -name "*.apk" -exec cp {} release-assets/LuckyApp.apk \; || true
          fi
          find android/ -name "*release*.aab" -exec cp {} release-assets/LuckyApp.aab \; || true
          if [ ! -f release-assets/LuckyApp.aab ]; then
            find android/ -name "*.aab" -exec cp {} release-assets/LuckyApp.aab \; || true
          fi
          echo "Release Assets Generated:"
          ls -lh release-assets/ || true

      - name: Upload Debug APK Artifact (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: LuckyApp-Debug-APK
          path: release-assets/LuckyApp.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Play Store Bundle AAB (Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: LuckyApp-PlayStore-Bundle-AAB
          path: release-assets/LuckyApp.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release with APK and Play Store AAB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Lucky App Android APK & Play Store Bundle (Build #${{ github.run_number }})"
          body: |
            ### 📱 Lucky App - Android APK & Google Play Console Bundle

            ✅ **1. நேரடி APK டவுன்லோட் (மொபைலில் உடனே இன்ஸ்டால் செய்ய):**
            - கீழே உள்ள Assets பகுதியில் **`LuckyApp.apk`**-ஐ கிளிக் செய்து டவுன்லோட் செய்து உங்கள் மொபைலில் நேரடியாக இன்ஸ்டால் செய்து பயன்படுத்தலாம்.

            🚀 **2. Google Play Store Console அப்லோட் (.aab Bundle):**
            - கீழே உள்ள Assets பகுதியில் **`LuckyApp.aab`**-ஐ பதிவிறக்கம் செய்து உங்கள் **Google Play Console**-ல் Production / Internal Testing Track-ல் பதிவேற்றம் செய்ய தயார் செய்யப்பட்டுள்ளது!
            - Android 15 (Target SDK 35) Play Store விதிகளுக்கு ஏற்ப முழுமையாக கட்டமைக்கப்பட்டுள்ளது.

            - **செயலி பெயர்:** Lucky App (லக்கி ஆப்)
            - **பேக்கேஜ் ஐடி (Package ID):** com.dailywork.app
            - **பில்ட் எண்:** #${{ github.run_number }}
          files: |
            release-assets/LuckyApp.apk
            release-assets/LuckyApp.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
