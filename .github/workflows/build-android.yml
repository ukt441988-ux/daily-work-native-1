name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "Configuring Android SDK from $ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" || true
          fi
          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            cat << 'EOF' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
ext {
  cdvMinSdkVersion = 24
  cdvPluginPostBuildExtras = []
  cordovaConfig = [:]
}
EOF
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: |
          npm install --include=dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || npx @capacitor/cli copy android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Regenerating gradle wrapper..."
            gradle wrapper --gradle-version 8.14.3 --distribution-type all || true
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Direct Download
        run: |
          mkdir -p release-assets
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-assets/LuckyApp.apk \;
          if [ ! -f release-assets/LuckyApp.apk ]; then
            find android/app/build/ -name "*.apk" -exec cp {} release-assets/LuckyApp.apk \;
          fi
          echo "APK prepared:"
          ls -lh release-assets/

      - name: Upload Debug APK Artifact (Install Directly on Mobile)
        uses: actions/upload-artifact@v4
        with:
          name: LuckyApp-Debug-APK
          path: release-assets/LuckyApp.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build Android App Bundle (AAB for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || gradle bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace || gradle bundleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Android App Bundle (AAB for Google Play Console ONLY)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LuckyApp-PlayStore-Bundle-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Lucky App Android APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 Lucky App Android App APK
            
            ✅ **நேரடி APK டவுன்லோட் (மொபைலில் இன்ஸ்டால் செய்ய):**
            கீழே Assets பகுதியில் உள்ள **`LuckyApp.apk`** ஃபைலை கிளிக் செய்து உங்கள் மொபைலில் நேரடியாக பதிவிறக்கம் (Download) செய்து இன்ஸ்டால் செய்யலாம்!
            
            ⚠️ **குறிப்பு:** Play Store Bundle (.aab) ஃபைல் மொபைலில் நேரடியாக இன்ஸ்டால் ஆகாது. அது Google Play Store Console-ல் பதிவேற்ற மட்டுமே பயன்படும். மொபைலில் பயன்படுத்த **`LuckyApp.apk`** மட்டுமே பயன்படுத்த வேண்டும்.
            
            - **செயலி பெயர்:** Lucky App (லக்கி ஆப்)
            - **தொகுப்பு (Package):** com.dailywork.app
            - **பில்ட் எண்:** #${{ github.run_number }}
            
            ---
            ### 📲 இன்ஸ்டால் செய்யும் முறை:
            1. கீழே உள்ள **`LuckyApp.apk`** பட்டனை அழுத்தவும்.
            2. டவுன்லோட் முடிந்ததும் அதைத் தொட்டு **Install** கொடுக்கவும்.
            3. "Install Unknown Apps" அனுமதி கேட்டால் **Allow** செய்யவும்.
          files: |
            release-assets/LuckyApp.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
